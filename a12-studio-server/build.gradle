plugins {
    id 'application'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'edu.sc.seis.launch4j' version '4.0.0'
}

application {
    mainClass = 'de.a12.studio.server.A12StudioServer'
}

dependencies {
    implementation project(':a12-studio-data-services')
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'a12-studio-server.jar'
}

launch4j {
    outfile = 'A12-Studio-Server.exe'
    mainClassName = 'org.springframework.boot.loader.launch.JarLauncher'
    jarTask = tasks.named('bootJar')
    headerType = 'console'
    copyConfigurable = files()
    libraryDir = ''
}
createExe.dependsOn bootJar

tasks.register('copyToOutput', Copy) {
    dependsOn createExe
    from(layout.buildDirectory.dir('launch4j')) {
        include 'A12-Studio-Server.exe'
    }
    from(layout.buildDirectory.dir('libs')) {
        include 'a12-studio-server.jar'
    }
    into "${rootDir}/Output/A12-Studio"
}

assemble.dependsOn copyToOutput
