dependencies {
    implementation project(':a12-studio-models')

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Fixture loading goes through JsonSettings.objectMapper, whose Jackson types are an
    // implementation detail of :a12-studio-models and thus not on the transitive compile classpath.
    testImplementation 'tools.jackson.core:jackson-databind:3.1.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
