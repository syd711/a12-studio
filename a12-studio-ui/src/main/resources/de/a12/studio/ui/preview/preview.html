<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A12 Studio Preview</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
  }
  #modules {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid #8888;
    padding: 8px;
    overflow-y: auto;
  }
  #modules button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    background: none;
    cursor: pointer;
    font-size: 14px;
    border-radius: 4px;
  }
  #modules button.selected {
    border-color: #4a90d9;
    background: #4a90d922;
  }
  #main {
    flex-grow: 1;
    padding: 12px 16px;
    overflow: auto;
  }
  #initialActivity {
    font-size: 12px;
    opacity: 0.75;
    margin-bottom: 12px;
    font-family: monospace;
  }
  .region {
    border: 1px solid #8888;
    border-radius: 6px;
    padding: 8px;
    margin: 8px 0;
  }
  .region-header {
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .region-layout {
    font-weight: normal;
    opacity: 0.6;
  }
  .view {
    background: #4a90d922;
    border: 1px solid #4a90d966;
    border-radius: 4px;
    padding: 4px 8px;
    margin: 4px 0;
    font-size: 13px;
  }
  .empty {
    opacity: 0.5;
    font-style: italic;
    font-size: 12px;
  }
</style>
</head>
<body>
<div id="modules"></div>
<div id="main">
  <div id="initialActivity"></div>
  <div id="regionTree"></div>
</div>
<script>
  const modelId = "__MODEL_ID__";
  const autoRefreshEnabled = __AUTO_REFRESH_ENABLED__;
  const autoRefreshDelayMillis = __AUTO_REFRESH_DELAY_MILLIS__;

  let selectedModule = null;
  let selectedScene = null;
  let lastRenderedJson = null;

  function dataUrl() {
    let url = "/preview/" + encodeURIComponent(modelId) + "/data";
    if (selectedModule && selectedScene) {
      url += "?module=" + encodeURIComponent(selectedModule) + "&scene=" + encodeURIComponent(selectedScene);
    }
    return url;
  }

  function labelText(labels) {
    return labels && labels.length > 0 ? labels[0].text : "(unnamed)";
  }

  function renderModules(modules) {
    const container = document.getElementById("modules");
    container.innerHTML = "";
    modules.forEach(module => {
      const button = document.createElement("button");
      button.textContent = labelText(module.label) || module.name;
      if (module.name === selectedModule) {
        button.classList.add("selected");
      }
      button.onclick = () => {
        selectedModule = module.name;
        selectedScene = module.defaultSceneName;
        lastRenderedJson = null;
        fetchData();
      };
      container.appendChild(button);
    });
  }

  function renderInitialActivity(descriptor) {
    const entries = Object.entries(descriptor || {});
    const el = document.getElementById("initialActivity");
    el.textContent = entries.length === 0
        ? "Initial Activity: (none)"
        : "Initial Activity: " + entries.map(([key, value]) => key + "=" + value).join(", ");
  }

  function renderRegion(region) {
    const el = document.createElement("div");
    el.className = "region";

    const header = document.createElement("div");
    header.className = "region-header";
    header.textContent = region.name + " ";
    const layout = document.createElement("span");
    layout.className = "region-layout";
    layout.textContent = region.layout ? "(" + region.layout + ")" : "(no layout)";
    header.appendChild(layout);
    el.appendChild(header);

    if (region.views.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "no view";
      el.appendChild(empty);
    }
    else {
      region.views.forEach(view => {
        const viewEl = document.createElement("div");
        viewEl.className = "view";
        viewEl.textContent = view;
        el.appendChild(viewEl);
      });
    }

    region.subRegions.forEach(subRegion => el.appendChild(renderRegion(subRegion)));
    return el;
  }

  function render(data) {
    renderModules(data.application.modules);
    renderInitialActivity(data.application.initialActivity);

    const regionTree = data.scene ? data.scene.regionTree : data.application.regionTree;
    const container = document.getElementById("regionTree");
    container.innerHTML = "";
    container.appendChild(renderRegion(regionTree));
  }

  function fetchData() {
    fetch(dataUrl())
        .then(response => response.json())
        .then(data => {
          const json = JSON.stringify(data);
          if (json !== lastRenderedJson) {
            lastRenderedJson = json;
            render(data);
          }
        })
        .catch(error => console.error("Preview refresh failed:", error));
  }

  fetchData();
  if (autoRefreshEnabled) {
    setInterval(fetchData, autoRefreshDelayMillis);
  }
</script>
</body>
</html>
