<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A12 Studio Preview</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
  }
  #sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid #8888;
    padding: 8px;
    overflow-y: auto;
  }
  #sidebar button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    background: none;
    cursor: pointer;
    font-size: 14px;
    border-radius: 4px;
  }
  #sidebar button.selected {
    border-color: #4a90d9;
    background: #4a90d922;
  }
  #main {
    flex-grow: 1;
    padding: 12px 16px;
    overflow: auto;
  }
  #initialActivity {
    font-size: 12px;
    opacity: 0.75;
    margin-bottom: 12px;
    font-family: monospace;
  }
  .node {
    border: 1px solid #8888;
    border-radius: 6px;
    padding: 8px;
    margin: 8px 0;
  }
  .node-header {
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .node-meta {
    font-weight: normal;
    opacity: 0.6;
  }
  .node.leaf {
    background: #4a90d922;
    border: 1px solid #4a90d966;
    border-radius: 4px;
    padding: 4px 8px;
    margin: 4px 0;
    font-size: 13px;
  }
  .fields {
    width: 100%;
    border-collapse: collapse;
    margin-top: 6px;
    font-size: 12px;
  }
  .fields th, .fields td {
    text-align: left;
    padding: 3px 6px;
    border-bottom: 1px solid #8884;
  }
  .fields th {
    opacity: 0.6;
    font-weight: normal;
  }
  .field-type {
    opacity: 0.6;
    font-family: monospace;
    font-size: 11px;
  }
  .empty {
    opacity: 0.5;
    font-style: italic;
    font-size: 12px;
  }
</style>
</head>
<body>
<div id="sidebar"></div>
<div id="main">
  <div id="initialActivity"></div>
  <div id="tree"></div>
</div>
<script>
  const modelId = "__MODEL_ID__";
  const autoRefreshEnabled = __AUTO_REFRESH_ENABLED__;
  const autoRefreshDelayMillis = __AUTO_REFRESH_DELAY_MILLIS__;

  let selectedModule = null;
  let selectedScene = null;
  let selectedScreenIndex = 0;
  let lastRenderedJson = null;

  function dataUrl() {
    let url = "/preview/" + encodeURIComponent(modelId) + "/data";
    if (selectedModule && selectedScene) {
      url += "?module=" + encodeURIComponent(selectedModule) + "&scene=" + encodeURIComponent(selectedScene);
    }
    return url;
  }

  function labelText(labels) {
    return labels && labels.length > 0 ? labels[0].text : "(unnamed)";
  }

  // Renders a generic {label, meta, fields, children, emptyLabel} node tree shared by the Application Model's
  // region/view tree and the Form Model's screen/section/control tree (see viewToNode/regionToNode and
  // screenElementToNode below, which adapt each model's own JSON shape into this common one).
  function renderNode(node) {
    const el = document.createElement("div");
    el.className = "node" + (node.children.length === 0 && node.fields.length === 0 ? " leaf" : "");

    const header = document.createElement("div");
    header.className = "node-header";
    header.textContent = (node.label || "") + " ";
    if (node.meta) {
      const meta = document.createElement("span");
      meta.className = "node-meta";
      meta.textContent = node.meta;
      header.appendChild(meta);
    }
    el.appendChild(header);

    if (node.fields.length > 0) {
      const table = document.createElement("table");
      table.className = "fields";
      node.fields.forEach(field => {
        const row = document.createElement("tr");
        const labelCell = document.createElement("td");
        labelCell.textContent = field.label;
        row.appendChild(labelCell);
        const typeCell = document.createElement("td");
        typeCell.className = "field-type";
        typeCell.textContent = field.fieldType || "";
        row.appendChild(typeCell);
        table.appendChild(row);
      });
      el.appendChild(table);
    }

    if (node.children.length > 0) {
      node.children.forEach(child => el.appendChild(renderNode(child)));
    }
    else if (node.fields.length === 0 && node.emptyLabel) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = node.emptyLabel;
      el.appendChild(empty);
    }

    return el;
  }

  function renderTree(nodes) {
    const container = document.getElementById("tree");
    container.innerHTML = "";
    nodes.forEach(node => container.appendChild(renderNode(node)));
  }

  // ---- Application Model: modules (sidebar) -> region/view tree ----

  function viewToNode(view) {
    return {
      label: view.name,
      meta: view.modelName ? "(" + view.modelName + ")" : null,
      fields: view.fields || [],
      children: [],
      emptyLabel: null
    };
  }

  function regionToNode(region) {
    const children = region.views.map(viewToNode).concat(region.subRegions.map(regionToNode));
    return {
      label: region.name,
      meta: region.layout ? "(" + region.layout + ")" : "(no layout)",
      fields: [],
      children: children,
      emptyLabel: children.length === 0 ? "no view" : null
    };
  }

  function renderModulesSidebar(modules) {
    const container = document.getElementById("sidebar");
    container.innerHTML = "";
    modules.forEach(module => {
      const button = document.createElement("button");
      button.textContent = labelText(module.label) || module.name;
      if (module.name === selectedModule) {
        button.classList.add("selected");
      }
      button.onclick = () => {
        selectedModule = module.name;
        selectedScene = module.defaultSceneName;
        lastRenderedJson = null;
        fetchData();
      };
      container.appendChild(button);
    });
  }

  function renderInitialActivity(descriptor) {
    const entries = Object.entries(descriptor || {});
    const el = document.getElementById("initialActivity");
    el.hidden = false;
    el.textContent = entries.length === 0
        ? "Initial Activity: (none)"
        : "Initial Activity: " + entries.map(([key, value]) => key + "=" + value).join(", ");
  }

  function renderApplicationData(data) {
    renderModulesSidebar(data.application.modules);
    renderInitialActivity(data.application.initialActivity);
    const regionTree = data.scene ? data.scene.regionTree : data.application.regionTree;
    renderTree([regionToNode(regionTree)]);
  }

  // ---- Form Model: screens (sidebar) -> section/control-grid/repeat tree ----

  function screenElementToNode(element) {
    return {
      label: element.title,
      meta: "(" + element.type + ")",
      fields: element.fields || [],
      children: (element.children || []).map(screenElementToNode),
      emptyLabel: "(empty)"
    };
  }

  function renderScreensSidebar(screens) {
    const container = document.getElementById("sidebar");
    container.innerHTML = "";
    screens.forEach((screen, index) => {
      const button = document.createElement("button");
      button.textContent = screen.title || screen.name || screen.id;
      if (index === selectedScreenIndex) {
        button.classList.add("selected");
      }
      button.onclick = () => {
        selectedScreenIndex = index;
        lastRenderedJson = null;
        render(lastData);
      };
      container.appendChild(button);
    });
  }

  function renderFormData(data) {
    document.getElementById("initialActivity").hidden = true;
    const screens = data.form.screens;
    renderScreensSidebar(screens);
    const screen = screens[Math.min(selectedScreenIndex, screens.length - 1)];
    renderTree(screen ? screen.elements.map(screenElementToNode) : []);
  }

  // ---- shared fetch/refresh ----

  let lastData = null;

  function render(data) {
    lastData = data;
    if (data.form) {
      renderFormData(data);
    }
    else {
      renderApplicationData(data);
    }
  }

  function fetchData() {
    fetch(dataUrl())
        .then(response => response.json())
        .then(data => {
          const json = JSON.stringify(data);
          if (json !== lastRenderedJson) {
            lastRenderedJson = json;
            render(data);
          }
        })
        .catch(error => console.error("Preview refresh failed:", error));
  }

  fetchData();
  if (autoRefreshEnabled) {
    setInterval(fetchData, autoRefreshDelayMillis);
  }
</script>
</body>
</html>
