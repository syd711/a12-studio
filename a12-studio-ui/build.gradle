plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'edu.sc.seis.launch4j' version '4.0.0'
}

application {
    mainClass = 'de.a12.studio.ui.Launcher'
}

// Written at configuration time (not inside a task) so it's regenerated on every Gradle
// sync/build, including a plain IDE project import - not just when a packaging task like
// shadowJar runs. This lets StudioVersion read the real version when running Launcher
// straight from the IDE, where classes come from an exploded output dir with no jar manifest.
def versionResourcesDir = layout.buildDirectory.dir('generated/resources/version').get().asFile
versionResourcesDir.mkdirs()
new File(versionResourcesDir, 'version.properties').text = "version=${project.version}\n"

sourceSets {
    main {
        resources.srcDir(versionResourcesDir)
    }
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web']
}

configurations {
    // "EXTERNAL" bundling: resolved jars must stay loose files (never merged into a fat jar) so
    // they can be staged as-is into a `wcf-cli/` folder and passed as a `-cp` argument to a
    // separate `java` subprocess running WcfCli - mirrors the reference project template's own
    // `wcfCli` configuration (project-template's root build.gradle).
    wcfCli {
        attributes {
            attribute(org.gradle.api.attributes.Bundling.BUNDLING_ATTRIBUTE,
                    objects.named(org.gradle.api.attributes.Bundling, org.gradle.api.attributes.Bundling.EXTERNAL))
        }
    }
}

dependencies {
    implementation project(':a12-studio-commons')
    implementation project(':a12-studio-plugin-manager')
    implementation project(':a12-studio-models')
    implementation project(':a12-studio-models-validation')
    implementation project(':a12-studio-data-services')
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'ch.qos.logback:logback-classic:1.5.32'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.commons:commons-lang3:3.16.0'
    // Bundled here (rather than per-plugin) so plugin modules that need it - directly, or
    // transitively via a library like jackcess - can depend on it as compileOnly instead of
    // shipping their own copy in their shadow jar; it's already on the running app's classpath.
    implementation 'commons-logging:commons-logging:1.4.0'
    // Bundled here (rather than in the create-from-excel plugin) so any plugin needing Excel
    // support can depend on it as compileOnly instead of shipping its own copy (with its own
    // large xmlbeans/commons-compress/etc. transitive graph) in its shadow jar.
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.4.0'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.4.0'
    implementation 'org.kordamp.ikonli:ikonli-bootstrapicons-pack:12.4.0'
    implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
    // Windows-only: low-level keyboard hook so Win+Left/Right window snapping can be
    // intercepted before the shell's own reserved Snap Assist handling consumes it.
    implementation 'net.java.dev.jna:jna-platform:5.15.0'
    // Pure-Java Microsoft Access reader; no ODBC or native drivers needed.

    // WCF -> RMC model conversion tool (injects the `__meta` metadata group every document model
    // needs before a real a12 kernel server - e.g. the Preview App server - can compute/validate
    // documents against it). Staged as loose jars (see `stageWcfCli` below), never on a12-studio's
    // own compile/runtime classpath - it's invoked in a separate `java -cp ... WcfCli` subprocess.
    wcfCli 'com.mgmtp.a12.dataservices.wcf:dataservices-wcf-cli:1.1.3'
    wcfCli 'com.mgmtp.a12.rmc:conversion:0.5.1'

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

shadowJar {
    archiveFileName = 'a12-studio-ui.jar'
    zip64 = true
    manifest {
        attributes 'Main-Class': 'de.a12.studio.ui.Launcher', 'Implementation-Version': project.version
    }
}

launch4j {
    outfile = 'A12-Studio.exe'
    mainClassName = 'de.a12.studio.ui.Launcher'
    jarTask = tasks.named('shadowJar')
    headerType = 'gui'
    copyConfigurable = files()
    libraryDir = ''
}
createExe.dependsOn shadowJar

tasks.register('copyToOutput', Copy) {
    dependsOn createExe
    from(layout.buildDirectory.dir('launch4j')) {
        include 'A12-Studio.exe'
    }
    from(layout.buildDirectory.dir('libs')) {
        include 'a12-studio-ui.jar'
    }
    into "${rootDir}/Output/A12-Studio"
}

// Stages the WCF-CLI + RMC conversion jars as loose files (not merged into shadowJar/a12-studio-ui.jar)
// next to A12-Studio.exe, so PreviewAppProcess/PreviewAppDeployer can resolve them relative to
// a12-studio's own install location at runtime and pass them as a `-cp` to a `WcfCli` subprocess.
tasks.register('stageWcfCli', Copy) {
    from configurations.wcfCli
    into "${rootDir}/Output/A12-Studio/wcf-cli"
}

assemble.dependsOn copyToOutput, stageWcfCli

tasks.register('prepareInstallerScript', Copy) {
    from 'src/main/resources/inno-installer-a12-studio-full.iss'
    into layout.buildDirectory.dir('installer')
    filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [version: project.version.toString()])
}

tasks.register('buildInstaller', Exec) {
    dependsOn prepareInstallerScript, copyToOutput, stageWcfCli, ':a12-studio-server:copyToOutput', ':generateLicenses'
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isWindows() }
    commandLine 'ISCC.exe', layout.buildDirectory.file('installer/inno-installer-a12-studio-full.iss').get().asFile
}
