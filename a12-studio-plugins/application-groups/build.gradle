plugins {
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls', 'javafx.fxml']
    // Already bundled into a12-studio-ui's fat jar, which sits on the classpath of the running
    // app that loads this plugin (see PluginManager.loadPlugin()) - don't re-bundle it here.
    configuration = 'compileOnly'
}

dependencies {
    // These are already on the host app's runtime classpath (bundled into a12-studio-ui's own
    // fat jar) by the time PluginManager loads this plugin's jar with the app's classloader as
    // parent - compileOnly avoids re-bundling them.
    compileOnly project(':a12-studio-commons')
    compileOnly project(':a12-studio-models')
    compileOnly project(':a12-studio-models-validation')
    compileOnly project(':a12-studio-plugin-manager')
    compileOnly 'org.slf4j:slf4j-api:2.0.17'

    // compileOnly deps aren't visible to the test sourceSet by default, and tests run in their
    // own JVM with no host app to supply them at runtime - restate them here for tests only.
    testImplementation project(':a12-studio-commons')
    testImplementation project(':a12-studio-models')
    testImplementation project(':a12-studio-models-validation')
    testImplementation project(':a12-studio-plugin-manager')

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Bundle plugin.json into the root of the JAR so PluginManager can find it.
processResources {
    from(projectDir) {
        include 'plugin.json'
    }
}
