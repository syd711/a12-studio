plugins {
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls', 'javafx.fxml']
    // Already bundled into a12-studio-ui's fat jar, which sits on the classpath of the running
    // app that loads this plugin (see PluginManager.loadPlugin()) - don't re-bundle it here.
    configuration = 'compileOnly'
}

dependencies {
    // These, and the two direct third-party deps below, are already on the host app's runtime
    // classpath (bundled into a12-studio-ui's own fat jar) by the time PluginManager loads this
    // plugin's jar with the app's classloader as parent - compileOnly avoids re-bundling them.
    compileOnly project(':a12-studio-commons')
    compileOnly project(':a12-studio-models')
    compileOnly project(':a12-studio-plugin-manager')
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    compileOnly 'org.kordamp.ikonli:ikonli-javafx:12.4.0'

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Bundle plugin.json into the root of the JAR so PluginManager can find it.
processResources {
    from(projectDir) {
        include 'plugin.json'
    }
}
