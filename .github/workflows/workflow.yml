name: A12 Studio Build

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ######################################################################################################################
  # Windows Packaging
  ######################################################################################################################
  build:
    name: Packaging
    runs-on: windows-latest
    steps:
      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Checkout A12 Studio
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Extract project version
        id: project
        shell: pwsh
        run: |
          $version = (Select-String -Path build.gradle -Pattern "version = '(.*)'").Matches[0].Groups[1].Value
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Installer
        run: .\gradlew.bat :a12-studio-ui:buildInstaller

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: A12-Studio-Installer-${{ steps.project.outputs.version }}
          path: |
            ./Output/A12-Studio/A12-Studio-Full-Installer-*.exe
